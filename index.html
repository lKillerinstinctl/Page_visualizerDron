<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyecto Dron Marino</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background: #0F254E;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 700px;
            width: 90%;
        }

        h1 {
            color: #FFFFFF;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5%;
            margin-bottom: 20px;
            align-items: left;
        }

        #model-container {
            width: 100%;
            height: 600px;
            border: 2px solid #FFFFFF;
            border-radius: 10px;
            overflow: hidden;
        }

        .fullscreen-btn {
            background-color: linear-gradient(to bottom left, #D3E8F4 0%, #D2C7F7 100%);
            color: #FFFFFF;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
            margin-top: 20px;
            width: 80%;
            max-width: 300px;
        }

        .fullscreen-btn:hover {
            background-color: #7A6A7B;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PROYECTO DRON MARINO</h1>
        <h2>PROTOTIPO</h2>
        <iframe id="model-container" src="https://sketchfab.com/models/3606fab6aef84736a0e139613165c608/embed?autostart=1" allow="fullscreen"></iframe>
        <button class="fullscreen-btn" onclick="activateFullscreen()">PANTALLA COMPLETA</button>
    </div>

    <script>
        /* Función para activar pantalla completa */
        function activateFullscreen() {
            const iframe = document.getElementById("model-container");
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.mozRequestFullScreen) {
                iframe.mozRequestFullScreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) {
                iframe.msRequestFullscreen();
            }
        }

        /* Detectar deslizamiento y redirigir */
        let startX = 0;
        let startY = 0;

        document.addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        document.addEventListener('touchend', function(e) {
            let endX = e.changedTouches[0].clientX;
            let endY = e.changedTouches[0].clientY;
            let diffX = endX - startX;
            let diffY = endY - startY;

            if (Math.abs(diffX) > Math.abs(diffY) && diffX < -50) { // Deslizar a la izquierda
                window.location.href = "infografia.html"; // Cambia a la URL de la infografía
            }
        });
    </script>
</body>
</html>
